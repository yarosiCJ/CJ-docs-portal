<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Clear Junction API documentation portal</title>
  <desc id="desc">OpenAPI reference, Postman collection, and integration scenario documentation for Clear Junction APIs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.48" stop-color="#111827"/>
      <stop offset="1" stop-color="#071114"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="20%" cy="20%" r="65%">
      <stop offset="0" stop-color="#62dcf7" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#62dcf7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="78%" cy="28%" r="54%">
      <stop offset="0" stop-color="#dcf763" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#dcf763" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62dcf7"/>
      <stop offset="0.5" stop-color="#21d6a1"/>
      <stop offset="1" stop-color="#dcf763"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#cyanGlow)"/>
  <rect width="1200" height="630" fill="url(#greenGlow)"/>

  <g opacity="0.22">
    <circle cx="1020" cy="500" r="160" fill="none" stroke="#62dcf7" stroke-width="2"/>
    <circle cx="1050" cy="485" r="96" fill="none" stroke="#dcf763" stroke-width="2"/>
    <path d="M60 560 C220 470 310 610 470 520 S760 430 930 540" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>

  <g transform="translate(82 72)">
    <rect x="0" y="0" width="1036" height="486" rx="34" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16" filter="url(#shadow)"/>
    <rect x="38" y="38" width="960" height="410" rx="24" fill="#0f172a" fill-opacity="0.84" stroke="#ffffff" stroke-opacity="0.12"/>

    <g transform="translate(76 72)">
      <text x="0" y="0" fill="#d6dee8" font-family="Figtree, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="4">CLEAR JUNCTION</text>
      <text x="0" y="84" fill="#ffffff" font-family="Figtree, Arial, sans-serif" font-size="74" font-weight="900" letter-spacing="-2">API Documentation</text>
      <text x="0" y="154" fill="#ffffff" font-family="Figtree, Arial, sans-serif" font-size="74" font-weight="900" letter-spacing="-2">Portal</text>
      <text x="0" y="220" fill="#cbd5e1" font-family="Figtree, Arial, sans-serif" font-size="30" font-weight="500">OpenAPI reference, Postman collection,</text>
      <text x="0" y="262" fill="#cbd5e1" font-family="Figtree, Arial, sans-serif" font-size="30" font-weight="500">and integration scenario guides.</text>
    </g>

    <g transform="translate(740 104)">
      <rect x="0" y="0" width="212" height="260" rx="24" fill="#111827" stroke="#ffffff" stroke-opacity="0.16"/>
      <rect x="24" y="28" width="68" height="26" rx="13" fill="#dcf763"/>
      <text x="40" y="47" fill="#111111" font-family="Figtree, Arial, sans-serif" font-size="16" font-weight="900">LIVE</text>
      <text x="24" y="96" fill="#ffffff" font-family="Figtree, Arial, sans-serif" font-size="26" font-weight="900">Contract</text>
      <rect x="24" y="124" width="164" height="40" rx="12" fill="#ffffff" fill-opacity="0.08"/>
      <text x="42" y="151" fill="#62dcf7" font-family="Figtree, Arial, sans-serif" font-size="19" font-weight="800">OpenAPI</text>
      <rect x="24" y="176" width="164" height="40" rx="12" fill="#ffffff" fill-opacity="0.08"/>
      <text x="42" y="203" fill="#c084fc" font-family="Figtree, Arial, sans-serif" font-size="19" font-weight="800">Postman</text>
      <rect x="24" y="228" width="164" height="40" rx="12" fill="#ffffff" fill-opacity="0.08"/>
      <text x="42" y="255" fill="#dcf763" font-family="Figtree, Arial, sans-serif" font-size="19" font-weight="800">Scenarios</text>
    </g>

    <rect x="76" y="404" width="884" height="8" rx="4" fill="url(#accent)"/>
  </g>
</svg>
